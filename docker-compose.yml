# =============================================================================
# OSRM Server - Centralized multi-region configuration
# =============================================================================
#
# Shared OSRM server across all projects.
# Each region has its own service on a distinct port.
#
# Data structure:
#   regions/
#     canada/
#       canada-latest.osm.pbf   <- shared source
#       ch/                     <- osrm files for the CH algorithm (mounted here)
#       mld/                    <- osrm files for MLD, if ever prepared
#     quebec/, usa/, netherlands/, australia/, italy/  -> same layout
#
# CH and MLD share no generated file, so each algorithm gets its own directory.
# Switch a service to MLD by mounting .../mld and passing --algorithm mld.
#
# Usage:
#   1. Initial setup (once per region):
#      ./setup.sh canada        (CH; './setup.sh canada mld' for MLD)
#
#   2. Start the servers:
#      docker compose up -d
#
#   3. From any project:
#      curl "http://localhost:5001/route/v1/driving/-73.56,45.50;-73.57,45.51"
#
# =============================================================================

services:
  # ===========================================================================
  # Canada - Port 5001
  # ===========================================================================
  osrm-canada:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-arm64-debian
    container_name: osrm-canada
    command: osrm-routed --algorithm ch --max-table-size 5000 /data/canada-latest.osrm
    volumes:
      - ./regions/canada/ch:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:5000/route/v1/driving/-73.5,45.5;-73.6,45.6?overview=false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3.5G

  # ===========================================================================
  # Netherlands - Port 5004
  # ===========================================================================
  osrm-netherlands:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-arm64-debian
    container_name: osrm-netherlands
    command: osrm-routed --algorithm ch --max-table-size 5000 /data/netherlands-latest.osrm
    volumes:
      - ./regions/netherlands/ch:/data:ro
    ports:
      - "5004:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:5000/route/v1/driving/4.8945,52.3667;5.1214,52.0907?overview=false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G

  # ===========================================================================
  # Italy - Port 5006
  # ===========================================================================
  osrm-italy:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-arm64-debian
    container_name: osrm-italy
    command: osrm-routed --algorithm ch --max-table-size 5000 /data/italy-latest.osrm
    volumes:
      - ./regions/italy/ch:/data:ro
    ports:
      - "5006:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:5000/route/v1/driving/12.4964,41.9028;9.1900,45.4642?overview=false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2.5G

