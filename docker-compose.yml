# =============================================================================
# OSRM Server - Centralized multi-region configuration
# =============================================================================
#
# Shared OSRM server across all projects.
# Each region has its own service on a distinct port.
#
# Data structure:
#   regions/
#     canada/      -> canada-latest.osrm + associated files
#     quebec/      -> quebec-latest.osrm + associated files
#     usa/         -> usa-latest.osrm + associated files
#     netherlands/ -> netherlands-latest.osrm + associated files
#     australia/   -> australia-latest.osrm + associated files
#
# Usage:
#   1. Initial setup (once per region):
#      ./setup.sh canada
#
#   2. Start the servers:
#      docker compose up -d
#
#   3. From any project:
#      curl "http://localhost:5001/route/v1/driving/-73.56,45.50;-73.57,45.51"
#
# =============================================================================

services:
  # ===========================================================================
  # Canada - Port 5001
  # ===========================================================================
  osrm-canada:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-canada
    command: osrm-routed --algorithm mld --max-table-size 5000 /data/canada-latest.osrm
    volumes:
      - ./regions/canada:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:5000/route/v1/driving/-73.5,45.5;-73.6,45.6?overview=false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3.5G

  # ===========================================================================
  # Netherlands - Port 5004
  # ===========================================================================
  osrm-netherlands:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-netherlands
    command: osrm-routed --algorithm mld --max-table-size 5000 /data/netherlands-latest.osrm
    volumes:
      - ./regions/netherlands:/data:ro
    ports:
      - "5004:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:5000/route/v1/driving/4.8945,52.3667;5.1214,52.0907?overview=false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G

